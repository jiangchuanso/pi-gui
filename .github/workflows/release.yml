name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  # Manual dispatch is the escape hatch to (re)run a release for an existing
  # tag/commit after CI has already packaged it, e.g. when a prior run failed.
  # Dispatching against a tag ref keeps GITHUB_SHA/GITHUB_REF_NAME aligned with
  # the candidate artifacts the pipeline promotes. Replacing an existing release
  # stays opt-in: a tag push must never destroy published assets.
  workflow_dispatch:
    inputs:
      replace_release:
        description: "Delete the existing release of this tag before staging a fresh draft. Published assets are permanently lost."
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-preflight:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify release tag and product versions
        run: node scripts/verify-release-version.mjs --tag "$GITHUB_REF_NAME"

  # CI packages a commit when it lands on main, and only there. This pipeline
  # promotes those bytes, so a tagged commit is never packaged a second time.
  wait-for-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for CI to package this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ github.sha }}"
          deadline=$(( $(date +%s) + 7200 ))
          # A tag normally follows the main push that packaged its commit, so the
          # run either exists or appears within seconds. A commit CI never
          # packaged has no run to wait for at all, so stop after a short grace
          # period instead of polling for the full deadline.
          missingDeadline=$(( $(date +%s) + 900 ))
          while :; do
            runs="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${sha}&exclude_pull_requests=true&per_page=100")"
            if [ "$(echo "$runs" | jq -r '.workflow_runs | length')" = "0" ]; then
              if [ "$(date +%s)" -gt "$missingDeadline" ]; then
                echo "::error::ci.yml has no run for ${sha}; CI packages pushes to main, so tag a commit whose CI run succeeded, or dispatch ci.yml against this tag and rerun this release"
                exit 1
              fi
              echo "ci.yml has no run for ${sha} yet; retrying in 30s..."
              sleep 30
              continue
            fi
            # Any successful run of this commit packaged exactly the bytes that
            # candidate resolution later requires, so one success is enough even
            # when another run of the same commit is still going.
            packaged="$(echo "$runs" | jq -r '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty')"
            if [ -n "$packaged" ]; then
              echo "ci.yml run ${packaged} succeeded for ${sha}; proceeding to stage the release"
              exit 0
            fi
            if [ "$(echo "$runs" | jq -r '[.workflow_runs[] | select(.status != "completed")] | length')" != "0" ]; then
              if [ "$(date +%s)" -gt "$deadline" ]; then
                echo "::error::Timed out after 120m waiting for ci.yml to package ${sha}; release aborted"
                exit 1
              fi
              echo "ci.yml has not packaged ${sha} yet; retrying in 30s..."
              sleep 30
              continue
            fi
            echo "::error::Every ci.yml run of ${sha} finished without success: $(echo "$runs" | jq -r '[.workflow_runs[] | .conclusion] | join(", ")'). Rerun that commit's packaging run, then rerun this release"
            exit 1
          done

  # Resolve the packaging run of the tagged commit and promote its exact bytes.
  resolve-candidate:
    needs:
      - release-preflight
      - wait-for-ci
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    outputs:
      run-id: ${{ steps.resolve.outputs.run-id }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve the CI-packaged candidates
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node apps/desktop/scripts/resolve-ci-candidate.mjs \
            --workflow ci.yml \
            --commit "$GITHUB_SHA" \
            --artifact "ci-release-linux-$GITHUB_SHA" \
            --artifact "ci-release-linux-arm64-$GITHUB_SHA" \
            --artifact "ci-release-windows-$GITHUB_SHA"

  stage-draft:
    needs:
      - resolve-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    # A step's `if` can only read the job environment, so the authorization to
    # replace an existing release is resolved here from the dispatch input. A tag
    # push leaves the input empty and therefore always fails closed.
    env:
      REPLACE_RELEASE: ${{ inputs.replace_release }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download the CI-packaged candidates
        uses: actions/download-artifact@v8
        with:
          pattern: ci-release-*-${{ github.sha }}
          path: release-candidate
          merge-multiple: true
          run-id: ${{ needs.resolve-candidate.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Validate combined release candidate
        run: |
          node apps/desktop/scripts/release-artifacts.mjs verify \
            --platform all \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --input release-candidate

      - name: Check existing release state
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$REPLACE_RELEASE" = "true" ]; then
            node apps/desktop/scripts/github-release-state.mjs --replace-release
          else
            node apps/desktop/scripts/github-release-state.mjs
          fi

      - name: Replace the existing release
        if: ${{ env.REPLACE_RELEASE == 'true' && steps.release-state.outputs.state != 'absent' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Deleting the existing ${{ steps.release-state.outputs.state }} release for ${GITHUB_REF_NAME} before staging its replacement"
          # Delete by id so a draft and a published release are both handled, and
          # never the tag itself: the tagged commit stays the release's target.
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${{ steps.release-state.outputs.id }}"
          # Fail closed unless the tag now has no release at all.
          node apps/desktop/scripts/github-release-state.mjs

      - name: Upload validated draft
        uses: softprops/action-gh-release@v3
        with:
          files: release-candidate/*
          draft: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true

  verify-draft-linux:
    needs: stage-draft
    runs-on: ubuntu-latest
    # GitHub requires push access even to read unpublished draft assets.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --dir draft-release

      - name: Verify draft manifests and bytes
        run: |
          node apps/desktop/scripts/release-artifacts.mjs verify \
            --platform all \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --input draft-release

      - name: Verify draft Linux packages
        run: |
          bash apps/desktop/scripts/verify-linux-release.sh \
            --install \
            "$PWD/draft-release" \
            "${GITHUB_REF_NAME#v}" \
            "$RUNNER_TEMP/draft-linux-proof"

  verify-draft-linux-arm64:
    needs: stage-draft
    runs-on: ubuntu-24.04-arm
    # GitHub requires push access even to read unpublished draft assets.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --dir draft-release

      - name: Verify draft manifests and bytes
        run: |
          node apps/desktop/scripts/release-artifacts.mjs verify \
            --platform all \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --input draft-release

      - name: Verify draft Linux arm64 packages
        run: |
          bash apps/desktop/scripts/verify-linux-release.sh \
            --install \
            "$PWD/draft-release" \
            "${GITHUB_REF_NAME#v}" \
            "$RUNNER_TEMP/draft-linux-arm64-proof"

  verify-draft-windows:
    needs: stage-draft
    runs-on: windows-latest
    # GitHub requires push access even to read unpublished draft assets.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --dir draft-release

      - name: Verify draft manifests and bytes
        shell: bash
        run: |
          node apps/desktop/scripts/release-artifacts.mjs verify \
            --platform all \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --input draft-release

      - name: Verify draft Windows packages
        shell: pwsh
        run: |
          ./apps/desktop/scripts/verify-windows-release.ps1 `
            -ReleaseDir "$PWD/draft-release" `
            -Version "$($env:GITHUB_REF_NAME -replace '^v', '')" `
            -SmokePackages

  publish:
    needs:
      - verify-draft-linux
      - verify-draft-linux-arm64
      - verify-draft-windows
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Require the validated draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/github-release-state.mjs --require-draft

      - name: Revalidate draft bytes before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir final-draft-check
          gh release download "$GITHUB_REF_NAME" --dir final-draft-check
          node apps/desktop/scripts/release-artifacts.mjs verify \
            --platform all \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --input final-draft-check

      - name: Publish validated draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Verify published release bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir published-release
          gh release download "$GITHUB_REF_NAME" --dir published-release
          node apps/desktop/scripts/release-artifacts.mjs verify \
            --platform all \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --input published-release

  verify-published-linux:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --dir published-release

      - name: Verify published manifests and bytes
        run: |
          node apps/desktop/scripts/release-artifacts.mjs verify \
            --platform all \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --input published-release

      - name: Verify published Linux packages
        run: |
          bash apps/desktop/scripts/verify-linux-release.sh \
            --install \
            "$PWD/published-release" \
            "${GITHUB_REF_NAME#v}" \
            "$RUNNER_TEMP/published-linux-proof"

  verify-published-linux-arm64:
    needs: publish
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --dir published-release

      - name: Verify published manifests and bytes
        run: |
          node apps/desktop/scripts/release-artifacts.mjs verify \
            --platform all \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --input published-release

      - name: Verify published Linux arm64 packages
        run: |
          bash apps/desktop/scripts/verify-linux-release.sh \
            --install \
            "$PWD/published-release" \
            "${GITHUB_REF_NAME#v}" \
            "$RUNNER_TEMP/published-linux-arm64-proof"

  verify-published-windows:
    needs: publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --dir published-release

      - name: Verify published manifests and bytes
        shell: bash
        run: |
          node apps/desktop/scripts/release-artifacts.mjs verify \
            --platform all \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --input published-release

      - name: Verify published Windows packages
        shell: pwsh
        run: |
          ./apps/desktop/scripts/verify-windows-release.ps1 `
            -ReleaseDir "$PWD/published-release" `
            -Version "$($env:GITHUB_REF_NAME -replace '^v', '')" `
            -SmokePackages
